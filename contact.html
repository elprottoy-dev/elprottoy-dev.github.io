  <main id="main-content" tabindex="-1">
    <section class="container reveal">
      <h2>Contact Me</h2>
      <p>Prefer email? <a href="mailto:you@domain.com">you@domain.com</a></p>

      <!-- Formspree example (replace action with your own) -->
      <form action="https://formspree.io/f/your_form_id" method="POST" class="contact-form">
        <label>
          <span>Name</span>
          <input type="text" name="name" required>
        </label>

        <label>
          <span>Email</span>
          <input type="email" name="email" required>
        </label>

        <label>
          <span>Message</span>
          <textarea name="message" rows="6" required></textarea>
        </label>

        <!-- honeypot -->
        <input type="text" name="_gotcha" style="display:none">

        <button type="submit" class="btn">Send Message</button>
      </form>

      <div class="contact-meta">
        <h3>Connect</h3>
        <ul>
          <li><a href="#" target="_blank" rel="noopener">GitHub</a></li>
          <li><a href="#" target="_blank" rel="noopener">LinkedIn</a></li>
        </ul>
      </div>
    </section>
