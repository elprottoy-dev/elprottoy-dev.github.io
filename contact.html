<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Khaled Prottoy</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #1db954;
  --dark-bg: #0f0f0f;
  --light-bg: #f7f7f7;
  --card-bg: #1a1a1a;
  --card-bg-light: #fff;
  --text-light: #ffffff;
  --text-dark: #1a1a1a;
  --text-muted: #aaaaaa;
  --transition: 0.3s ease;
}
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--dark-bg);
  color: var(--text-light);
  transition: background 0.3s, color 0.3s;
}
body.light-theme {
  background: var(--light-bg);
  color: var(--text-dark);
}

/* Navbar */
#navbar {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  z-index: 1000;
  backdrop-filter: blur(10px);
  background-color: rgba(15,15,15,0.9);
  transition: background 0.3s;
}
.nav-links {
  display: flex;
  gap: 2rem;
  align-items: center;
}
.nav-links li a {
  color: var(--text-light);
  font-weight: 500;
  transition: var(--transition);
  text-decoration: none;
}
.nav-links li a:hover { color: var(--accent); }
.btn {
  padding: 0.5rem 1rem;
  border-radius: 8px;
  border: 2px solid var(--accent);
  color: var(--accent);
  font-weight: 500;
  transition: var(--transition);
  text-decoration: none;
}
.btn:hover {
  background: var(--accent);
  color: var(--dark-bg);
}
.theme-toggle { margin-left: 1rem; cursor: pointer; font-size: 1.2rem; }
.menu-toggle { display: none; cursor: pointer; font-size: 1.5rem; color: var(--accent); }
@media (max-width: 768px) {
  .nav-links {
    position: fixed;
    top: 70px;
    right: -100%;
    flex-direction: column;
    background-color: rgba(15,15,15,0.95);
    width: 220px;
    padding: 2rem;
    transition: right 0.3s ease;
    border-radius: 10px 0 0 10px;
  }
  .nav-links.active { right: 0; }
  .nav-links li { margin: 1rem 0; }
  .menu-toggle { display: block; }
}

/* Hero Section */
#contact-hero {
  max-width: 1100px;
  margin: 120px auto 50px;
  padding: 0 2rem;
  text-align: center;
}
#contact-hero h1 { font-size: 2.8rem; color: var(--accent); margin-bottom: 0.5rem; }
#contact-hero p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2rem; }

/* Contact Form */
.contact-container {
  max-width: 800px;
  margin: 0 auto 50px;
  padding: 2rem;
  background: var(--card-bg);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(29,185,84,0.2);
}
.contact-container h2 { text-align: center; margin-bottom: 1.5rem; color: var(--accent); }
.contact-form { display: flex; flex-direction: column; gap: 1rem; }
.contact-form label { font-weight: 500; margin-bottom: 0.3rem; color: var(--text-light); }
.contact-form input, .contact-form textarea {
  padding: 0.8rem 1rem;
  border-radius: 8px;
  border: 1px solid #333;
  background: var(--dark-bg);
  color: var(--text-light);
  font-size: 1rem;
  transition: var(--transition);
}
body.light-theme .contact-form input, body.light-theme .contact-form textarea {
  background: var(--card-bg-light);
  color: var(--text-dark);
  border: 1px solid #ccc;
}
.contact-form input:focus, .contact-form textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(29,185,84,0.3);
}
.contact-form textarea { resize: vertical; min-height: 150px; }
.contact-form button {
  padding: 0.8rem 1.2rem;
  border-radius: 8px;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.contact-form button:hover {
  background: var(--accent);
  color: var(--dark-bg);
}

/* Footer */
footer {
  text-align: center;
  padding: 3rem 2rem;
  background: var(--dark-bg);
  color: var(--text-muted);
}

/* Responsive */
@media(max-width: 768px){
  #contact-hero { margin: 100px 1rem 50px; }
  .contact-container { padding: 1.5rem; }
}
</style>
</head>
<body>

<!-- Navbar -->
<nav id="navbar">
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="experience.html">Experience</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="Khaled_Prottoy_CV.pdf" target="_blank" class="btn">Resume</a></li>
  </ul>
  <div class="theme-toggle" id="theme-toggle">🌙</div>
  <div class="menu-toggle" id="menu-toggle">☰</div>
</nav>

<!-- Hero Section -->
<section id="contact-hero">
  <h1>Get in Touch</h1>
  <p>I'd love to hear from you! Fill out the form below or reach me via email/socials.</p>
</section>

<!-- Contact Form -->
<section class="contact-container">
  <h2>Contact Form</h2>
  <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label for="name">Full Name</label>
    <input type="text" name="name" id="name" placeholder="Your full name" required>

    <label for="email">Email Address</label>
    <input type="email" name="email" id="email" placeholder="Your email" required>

    <label for="subject">Subject</label>
    <input type="text" name="subject" id="subject" placeholder="Subject" required>

    <label for="message">Message</label>
    <textarea name="message" id="message" placeholder="Your message..." required></textarea>

    <button type="submit">Send Message</button>
  </form>
</section>

<!-- Footer -->
<footer>
  <p>&copy; 2025 Khaled Prottoy | All Rights Reserved</p>
</footer>

<script>
// Theme toggle
const toggle = document.getElementById('theme-toggle');
const body = document.body;
const savedTheme = localStorage.getItem('theme');
if(savedTheme){
  body.classList.toggle('light-theme', savedTheme === 'light');
  toggle.textContent = savedTheme === 'light' ? '🌙' : '☀️';
}
toggle.addEventListener('click', ()=>{
  body.classList.toggle('light-theme');
  const isLight = body.classList.contains('light-theme');
  toggle.textContent = isLight ? '🌙' : '☀️';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
});

// Mobile menu toggle
const menuToggle = document.getElementById('menu-toggle');
const navLinks = document.querySelector('.nav-links');
menuToggle.addEventListener('click', ()=> navLinks.classList.toggle('active'));
</script>

</body>
</html>
